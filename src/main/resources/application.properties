spring.application.name=backend
spring.profiles.active=dev

# Server & Reverse Proxy Configuration
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Security & Secret Configuration
jwt.secret=${JWT_SECRET:defaultSecretKeyThatShouldBeAtLeast256BitsLongForHS256Algorithm}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
aquaflow.jwt.secret=${JWT_SECRET:your-jwt-secret}
aquaflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
aquaflow.lora.webhook-secret=${LORAWAN_WEBHOOK_SECRET:your-webhook-secret}
aquaflow.lora.chirpstack.webhook-secret=${LORAWAN_WEBHOOK_SECRET:${aquaflow.lora.webhook-secret:your-webhook-secret}}
aquaflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://api-aquaflow.gladwindr.me,https://arvacore.gladwindr.me,https://*.gladwindr.me,https://*.vercel.app,http://localhost:*,http://127.0.0.1:*}

# ArvaCore field gateway ingestion key (server-side; defaults to the configured thesis gateway key)
arvacore.gateway.ingest-key=${ARVACORE_GATEWAY_INGEST_KEY:ed630e681ef735f36954469b48f832f210286246ca95fff62e62086cab74e8a9}
# Node freshness: nodes with no uplink within this window are reported stale
arvacore.telemetry.stale-after-minutes=${ARVACORE_STALE_AFTER_MINUTES:15}

# HikariCP Connection Pool Tuning for High-Concurrency REST Synchronization & 3s Telemetry
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:1200000}
spring.jpa.open-in-view=false

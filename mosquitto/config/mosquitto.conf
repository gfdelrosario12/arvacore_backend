# =============================================================================
# Mosquitto MQTT Broker — Production Configuration
# =============================================================================

# Listener for MQTT clients (backend, IoT devices)
listener 1883
protocol mqtt
allow_anonymous true

# WebSocket listener (for browser-based MQTT clients)
listener 9001
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice

